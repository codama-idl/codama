name: Cut

on:
  workflow_dispatch:
    inputs:
      tracking-issue:
        description: 'Open a transition tracking issue'
        type: boolean
        default: false
      announce:
        description: 'Open the announcement thread in the ecosystem hub Discussions'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  cut:
    uses: codama-idl/release-tools/.github/workflows/cut.yml@cc0b8c9589e43c869233e2533dacb35f25b188e4 # v1.2.0
    with:
      tracking-issue: ${{ inputs.tracking-issue }}
      announce: ${{ inputs.announce }}
    secrets: inherit
