# Dependabot version updates. Opens PRs to keep dependency versions fresh.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: daily
      time: '01:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    groups:
      # Solana Kit packages (published from anza-xyz/kit) move in lockstep,
      # so bump them together. Non-Kit @solana/* packages are deliberately
      # not listed here.
      solana-kit:
        patterns:
          - '@solana/accounts'
          - '@solana/addresses'
          - '@solana/codecs*'
          - '@solana/instructions'
          - '@solana/kit'
      solana-program:
        patterns:
          - '@solana-program/*'
      # The oxc toolchain versions often need to move together to keep
      # lint and format rules consistent.
      oxc:
        patterns:
          - 'oxlint'
          - 'oxfmt'
          - 'oxlint-tsgolint'
          - '@solana-config/oxc'

  # GitHub Actions used across .github/workflows/*.
  # Third-party actions are pinned to commit SHAs and this keeps the pins from rotting.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
        # Minor and patch bumps are grouped into one PR.
        # Majors are split out so each can be reviewed on its own.
        update-types:
          - "minor"
          - "patch"
