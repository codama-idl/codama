version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: daily
      time: '01:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    groups:
      # Solana Kit packages (published from anza-xyz/kit) move in lockstep,
      # so bump them together. Non-Kit @solana/* packages are deliberately
      # not listed here.
      solana-kit:
        patterns:
          - '@solana/accounts'
          - '@solana/addresses'
          - '@solana/codecs*'
          - '@solana/instructions'
          - '@solana/kit'
      solana-program:
        patterns:
          - '@solana-program/*'
      # The oxc toolchain versions often need to move together to keep
      # lint and format rules consistent.
      oxc:
        patterns:
          - 'oxlint'
          - 'oxfmt'
          - 'oxlint-tsgolint'
          - '@solana-config/oxc'
